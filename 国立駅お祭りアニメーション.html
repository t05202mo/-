const svgNS='http://www.w3.org/2000/svg';const lanterns=document.getElementById('lanterns');for(let i=0;i<17;i++){let x=30+i*96,y=230+125*Math.sin(Math.PI*i/16);let g=document.createElementNS(svgNS,'g');g.setAttribute('class','lantern');g.setAttribute('style',`animation-delay:${-i*.21}s`);g.setAttribute('transform',`translate(${x} ${y})`);g.innerHTML=`<line y2="19" stroke="#e6c8a7" stroke-width="2"/><ellipse cx="0" cy="44" rx="20" ry="28" fill="url(#halo)"/><rect x="-15" y="19" width="30" height="47" rx="13" fill="${i%3===0?'#f0c68e':'#df7b65'}"/><path d="M-8 21 Q-17 43 -8 64 M8 21 Q17 43 8 64" fill="none" stroke="#9d4b4c" opacity=".55"/><rect x="-13" y="17" width="26" height="5" rx="2" fill="#543d45"/><rect x="-13" y="64" width="26" height="5" rx="2" fill="#543d45"/>`;lanterns.append(g)}
const sparks=document.getElementById('sparks');for(let i=0;i<45;i++){let c=document.createElementNS(svgNS,'circle');c.setAttribute('class','spark');c.setAttribute('cx',Math.round(50+Math.random()*1500));c.setAttribute('cy',Math.round(700+Math.random()*180));c.setAttribute('r',1+Math.random()*3);c.setAttribute('fill',i%2?'#ffd99a':'#f7b78c');c.setAttribute('style',`animation-delay:${-Math.random()*7}s;animation-duration:${4+Math.random()*5}s`);sparks.append(c)}
const music=document.getElementById('music'),toggle=document.getElementById('toggle'),status=document.getElementById('status');function sync(){toggle.textContent=music.paused?'▶ 音を流す':'❚❚ 一時停止';status.textContent=music.paused?'♪ 祭りの音':'♫ 再生中'}toggle.addEventListener('click',async()=>{if(music.paused){try{await music.play()}catch(e){status.textContent='タップして再生してください'}}else music.pause();sync()});music.addEventListener('play',sync);music.addEventListener('pause',sync);window.addEventListener('load',()=>{music.play().then(sync).catch(()=>sync())});
